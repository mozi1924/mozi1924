packages:
  - 'apps/*'
  - 'packages/*'

catalog:
  astro: ^7.4.4
  tailwindcss: ^4.3.3
  '@tailwindcss/vite': ^4.3.3
  '@tailwindcss/typography': ^0.5.20
  '@astrojs/sitemap': ^3.7.4
  '@astrojs/check': ^0.9.12
  typescript: ^6.0.3

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
  pagefind: true

minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@5.20261030.1'
  - lucide-react@1.65.0
  - miniflare@5.20261023.3-beta
  - wrangler@4.156.0
