name: Deploy Main Site to Cloudflare Pages

on:
  push:
    branches: ["main"]
    paths:
      - "apps/web/**"
      - ".github/workflows/deploy-main.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:
    inputs:
      archive_mode:
        description: "Wayback Machine archive mode"
        required: false
        default: "changed"
        type: choice
        options:
          - "changed"
          - "all"
          - "custom"
          - "skip"
      custom_urls:
        description: "Custom URLs or paths (comma-separated, used when mode=custom)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: "pages-main"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Main Site
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type and Astro checks
        run: pnpm --filter @mozi/web check

      - name: Build
        run: pnpm --filter @mozi/web build

      - name: Clean Wrangler redirected deploy config
        run: rm -rf apps/web/.wrangler/deploy

      - name: Verify build output
        run: |
          test -f apps/web/dist/_worker.js
          test -f apps/web/dist/pagefind/pagefind.js
          test -d apps/web/dist/_astro
          test -d apps/web/dist/blogs

      - name: Publish to Cloudflare Pages
        run: npx wrangler pages deploy apps/web/dist --project-name mozi1924
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Wait for Cloudflare CDN propagation
        if: success() && github.event.inputs.archive_mode != 'skip'
        run: sleep 10

      - name: Archive changed pages to Wayback Machine (Archive.org)
        if: success() && github.event.inputs.archive_mode != 'skip'
        continue-on-error: true
        run: |
          pnpm --filter @mozi/web run archive \
            --mode="${{ github.event.inputs.archive_mode || 'changed' }}" \
            --urls="${{ github.event.inputs.custom_urls || '' }}"
        env:
          CUSTOM_DOMAIN: "https://mozi1924.com"
          ARCHIVE_ACCESS_KEY: ${{ secrets.ARCHIVE_ACCESS_KEY }}
          ARCHIVE_SECRET_KEY: ${{ secrets.ARCHIVE_SECRET_KEY }}
          GITHUB_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
